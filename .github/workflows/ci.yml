name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-x64-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macos-arm64
            os: macos-14
            cc: clang
            cxx: clang++
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: windows-x64
            os: windows-latest
            cc: cl
            cxx: cl
            cmake_args: -A x64
          - name: windows-arm64
            os: windows-11-arm
            cc: cl
            cxx: cl
            cmake_args: -A ARM64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPTPNG_WITH_ZLIB_NG=OFF ${{ matrix.cmake_args }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test (unit + libpng parity)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Feature report
        run: ./build/ptpng_tool tests/gen/c2d8_i0_f0.png --info
        shell: bash

      - name: Fuzz smoke (60k mutations)
        run: |
          ./build/fuzz_png tests/gen/c6d16_i1_f4.png 20000 11
          ./build/fuzz_png third_party/libpng-libpng16/contrib/testpngs/palette-1.png 20000 12
          ./build/fuzz_png tests/gen/ancillary.png 20000 13
        shell: bash

  sanitize:
    name: linux-x64-asan-ubsan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan+UBSan, no libpng reference)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPTPNG_WITH_LIBPNG=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Unit tests under sanitizers
        run: ctest --test-dir build --output-on-failure

      - name: Corpus decode under sanitizers
        run: |
          for f in third_party/libpng-libpng16/contrib/testpngs/*.png; do
            ./build/ptpng_tool "$f" --native  >/dev/null
            ./build/ptpng_tool "$f" --rgba8  >/dev/null
            ./build/ptpng_tool "$f" --rgb8   >/dev/null
          done
          echo "corpus clean under ASan+UBSan"

      - name: Fuzz under sanitizers (270k mutations)
        run: |
          for seed in 1 2 3; do
            ./build/fuzz_png tests/gen/ancillary.png       20000 $((seed*100+1))
            ./build/fuzz_png tests/gen/c6d16_i1_f4.png     20000 $((seed*100+2))
            ./build/fuzz_png tests/gen/multiidat.png       20000 $((seed*100+3))
            ./build/fuzz_png tests/gen/paltrns_d4.png      20000 $((seed*100+4))
            ./build/fuzz_png third_party/libpng-libpng16/contrib/testpngs/rgb-16-tRNS.png 10000 $((seed*100+5))
          done
